# Local Postgres for The Old Wardrobe. Not used in production.
# Neon (Vercel Marketplace) supplies DATABASE_URL there.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe
      POSTGRES_DB: wardrobe
    ports:
      - "5432:5432"
    volumes:
      - wardrobe-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d wardrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wardrobe-pg:
